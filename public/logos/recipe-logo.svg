<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Bowl Surface Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Soup Broth Gradient -->
    <linearGradient id="soupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#044d36" flood-opacity="0.35" />
    </filter>
    <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.15" />

  <!-- Culinary Elements Group -->
  <g transform="translate(0, 16)">
    <!-- Rising Aromatic Steam Waves -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" opacity="0.95">
      <!-- Left Steam -->
      <path d="M 216 160 C 206 130, 226 110, 214 80" />
      <!-- Center Main Steam -->
      <path d="M 256 150 C 242 120, 268 95, 256 60" stroke-width="12" />
      <!-- Right Steam -->
      <path d="M 296 160 C 306 130, 286 110, 298 80" />
    </g>

    <!-- Little Sparkles / Herbs in Steam -->
    <circle cx="236" cy="98" r="4.5" fill="#fef08a" opacity="0.8" />
    <circle cx="278" cy="85" r="4" fill="#fef08a" opacity="0.8" />

    <!-- Traditional Burmese Bowl Handles -->
    <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" filter="url(#bowlShadow)">
      <path d="M 120 252 C 96 252, 96 288, 126 292" />
      <path d="M 392 252 C 416 252, 416 288, 386 292" />
    </g>

    <!-- Main Soup Bowl Body -->
    <path d="M 120 240 C 120 350, 180 376, 256 376 C 332 376, 392 350, 392 240 Z"
          fill="url(#bowlGrad)" filter="url(#bowlShadow)" />

    <!-- Bowl Rim Rim -->
    <ellipse cx="256" cy="240" rx="136" ry="32" fill="#ffffff" />
    <ellipse cx="256" cy="240" rx="136" ry="32" fill="none" stroke="#e2e8f0" stroke-width="4" />

    <!-- Golden Curry Broth (Mohinga / Burmese Curry) -->
    <ellipse cx="256" cy="242" rx="124" ry="25" fill="url(#soupGrad)" />

    <!-- Broth Highlights and Traditional Garnishes -->
    <ellipse cx="236" cy="240" rx="60" ry="10" fill="#fef08a" opacity="0.35" />
    <!-- Boiled Egg Half (Burmese favorite!) -->
    <g transform="translate(225, 230)">
      <ellipse cx="16" cy="12" rx="18" ry="13" fill="#ffffff" />
      <ellipse cx="16" cy="12" rx="10" ry="8" fill="#f59e0b" />
      <circle cx="14" cy="10" r="3" fill="#fbbf24" />
    </g>
    <!-- Fresh Coriander / Herb Leaves -->
    <g fill="#10b981">
      <circle cx="285" cy="242" r="5" />
      <circle cx="292" cy="240" r="4" />
      <circle cx="288" cy="247" r="4" />
      <circle cx="180" cy="244" r="4.5" />
      <circle cx="186" cy="247" r="3.5" />
    </g>
    <!-- Crispy Fritter Bits (Akyaw) -->
    <polygon points="315,236 325,233 322,242" fill="#d97706" />
    <polygon points="196,236 206,238 200,243" fill="#d97706" />

    <!-- Traditional Tasting Spoon -->
    <g transform="translate(310, 185) rotate(24)">
      <path d="M 0 0 C 15 -10, 35 -10, 45 5 C 55 20, 40 40, 20 40 C 0 40, -10 15, 0 0 Z" fill="#ffffff" />
      <path d="M 40 8 L 90 -45" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Bowl Base Pedestal -->
    <path d="M 206 374 C 206 388, 306 388, 306 374 Z" fill="#e2e8f0" />
  </g>
</svg>
